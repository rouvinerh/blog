name: GitHub Pages

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Check and build
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Check out the repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Set up Node.js
                uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
                with:
                    node-version: '24'
                    cache: npm
                    cache-dependency-path: package-lock.json

            -   name: Install dependencies
                run: npm ci

            -   name: Lint
                run: npm run lint

            -   name: Test Markdown and routes
                run: node --test scripts/content.test.mjs scripts/routes.test.mjs

            -   name: Build
                run: npm run build

            -   name: Check saved publication order
                run: |
                    if ! git diff --exit-code -- content/posts.json; then
                        echo "::error::Run npm run build locally and commit content/posts.json so publication order is saved."
                        exit 1
                    fi

            -   name: Upload Pages artifact
                if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
                uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
                with:
                    path: dist

    deploy:
        name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   name: Configure Pages
                uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
                with:
                    enablement: false

            -   name: Deploy Pages
                id: deployment
                uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
