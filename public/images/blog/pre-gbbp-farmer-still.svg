<svg xmlns="http://www.w3.org/2000/svg" width="396" height="218" viewBox="0 0 396 218" role="img" aria-labelledby="title description">
    <title id="title">The Farmer’s field</title>
    <desc id="description">The Farmer sows and harvests five plots in each of three rows labelled SQLi, IDOR and Biz Logic. A star marks a finding.</desc>
    <style>
        :root {
            color-scheme: light dark;
            --paper: #f0f4f7;
            --ink: #243442;
            --line: #697e90;
            --accent: #1d5fa8;
            --pink: #a52354;
            --tint: #f9e8ef;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #151f28;
                --ink: #e6edf3;
                --line: #829aaf;
                --accent: #8ab6e5;
                --pink: #ee8fb6;
                --tint: #332332;
            }
        }
        .panel { fill: var(--paper); stroke: var(--line); }
        .label { fill: var(--ink); text-anchor: middle; font: 600 16px ui-monospace, Consolas, monospace; }
        .lane { fill: none; stroke: var(--line); stroke-dasharray: 3 4; }
        .rim { fill: none; stroke: var(--accent); stroke-width: 2; }
        .spark { fill: var(--accent); }
        .sprout, .seeds, .empty { opacity: 0; }
    </style>
