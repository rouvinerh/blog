            :root { --paper: #151f28; --line: #829aaf; --ink: #e6edf3; --muted: #b6c8da; }
        }
        .panel { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
        .connector { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .divider { stroke: var(--line); stroke-width: 1; }
        .name { fill: var(--ink); font: 700 17px ui-monospace, Consolas, monospace; }
        .partner { fill: var(--muted); font: 600 15px system-ui, "Segoe UI", sans-serif; }
        .center { text-anchor: middle; }
    </style>
