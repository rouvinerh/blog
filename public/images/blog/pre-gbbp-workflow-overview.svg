    <title id="title">Pre-GBBP workflow overview</title>
    <desc id="description">Human (Me), Jackdaw, two Miners and two Farmers, one of each with the Cheerleader, a Writer, Human (Me), then YesWeHack.</desc>
    <style>
        :root { color-scheme: light dark; --paper: #f0f4f7; --line: #697e90; --ink: #243442; --muted: #475c70; }
