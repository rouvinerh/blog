<svg xmlns="http://www.w3.org/2000/svg" width="400" height="364" viewBox="0 0 400 364" role="img" aria-labelledby="title desc">
    <title id="title">Collect, probe and ask</title>
    <desc id="desc">Collect: 92 live applications, about 2,500 routes and 1,500 JavaScript files. Probe: about 3,500 requests across 2,300 endpoints. Ask: about 120 questions asked.</desc>
    <style>
        :root {
            color-scheme: light dark;
            --text: #243442;
            --muted: #4f5f6c;
            --card: #f0f4f7;
            --card-line: #c9d5df;
            --model: #c4501a;
            --model-soft: #fbe5d8;
            --code: #1d5fa8;
            --code-soft: #dfeaf6;
            --on-fill: #ffffff;
            --arrow: #6f8191;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #e6edf3;
                --muted: #c2cfda;
                --card: #151f28;
                --card-line: #3a4b59;
                --model: #f4a16f;
                --model-soft: #34271f;
                --code: #80b8f4;
                --code-soft: #1b3044;
                --on-fill: #0f171e;
                --arrow: #768796;
            }
        }
        text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .mono { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
        .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1; }
        .card-model { fill: var(--model-soft); stroke: var(--model); stroke-width: 1.4; }
        .card-code { fill: var(--code-soft); stroke: var(--code); stroke-width: 1.4; }
        .arrow { fill: none; stroke: var(--arrow); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .step { font-size: 18px; font-weight: 600; }
        .desc { font-size: 16px; fill: var(--muted); }
        .num { font-size: 15px; font-weight: 700; fill: var(--on-fill); text-anchor: middle; }
        .tag { font-size: 14px; font-weight: 600; text-anchor: middle; }
        .badge-code { fill: var(--code); }
        .badge-model { fill: var(--model); }
        .tag-code { fill: none; stroke: var(--code); stroke-width: 1.4; }
        .tag-model { fill: none; stroke: var(--model); stroke-width: 1.4; }
    </style>
    <g>
        <rect x="12.5" y="8.5" width="375" height="121" rx="10" class="card" />
        <circle cx="40" cy="38" r="15" class="badge-code" />
        <text x="40" y="43" class="num">1</text>
        <text x="66" y="44" class="step">Collect</text>
        <rect x="262" y="24" width="110" height="28" rx="14" class="tag-code" />
        <text x="317" y="43" class="tag">Deterministic</text>
        <text x="66" y="74" class="desc">92 live applications</text>
        <text x="66" y="96" class="desc">About 2,500 routes</text>
        <text x="66" y="118" class="desc">and 1,500 JavaScript files</text>
        <path d="M200 134V150M194 144l6 6 6-6" class="arrow" />
        <rect x="12.5" y="154.5" width="375" height="99" rx="10" class="card" />
        <circle cx="40" cy="184" r="15" class="badge-code" />
        <text x="40" y="189" class="num">2</text>
        <text x="66" y="190" class="step">Probe</text>
        <rect x="262" y="170" width="110" height="28" rx="14" class="tag-code" />
        <text x="317" y="189" class="tag">Deterministic</text>
        <text x="66" y="220" class="desc">About 3,500 requests</text>
        <text x="66" y="242" class="desc">across 2,300 endpoints</text>
        <path d="M200 258V274M194 268l6 6 6-6" class="arrow" />
        <rect x="12.5" y="278.5" width="375" height="77" rx="10" class="card-model" />
        <circle cx="40" cy="308" r="15" class="badge-model" />
        <text x="40" y="313" class="num">3</text>
        <text x="66" y="314" class="step">Ask</text>
        <rect x="324" y="294" width="48" height="28" rx="14" class="tag-model" />
        <text x="348" y="313" class="tag">AI</text>
        <text x="66" y="344" class="desc">About 120 questions asked</text>
    </g>
</svg>
