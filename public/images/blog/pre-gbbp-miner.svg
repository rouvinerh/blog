<svg xmlns="http://www.w3.org/2000/svg" width="396" height="308" viewBox="0 0 396 308" role="img" aria-labelledby="title description">
    <title id="title">The Miner’s shaft</title>
    <desc id="description">The Miner descends six layers of a pixel-art shaft and holds up a gem after finding the first bug.</desc>
    <style>
        :root {
            color-scheme: light dark;
            --paper: #f0f4f7;
            --ink: #243442;
            --line: #697e90;
            --accent: #1d5fa8;
            --pink: #a52354;
            --tint: #f9e8ef;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #151f28;
                --ink: #e6edf3;
                --line: #829aaf;
                --accent: #8ab6e5;
                --pink: #ee8fb6;
                --tint: #332332;
            }
        }
        .panel { fill: var(--paper); stroke: var(--line); }
        .label { fill: var(--ink); font: 600 16px ui-monospace, Consolas, monospace; }
        .marker { fill: var(--accent); }
        .discovery .label, .discovery .marker { fill: var(--pink); }
        .tunnel { transform: scaleY(6); transform-origin: 0 12px; }
        .digger { transform: translate(30px, 259px); }
        .mining { opacity: 0; }
        .pickaxe { transform-box: fill-box; transform-origin: 20% 75%; }
        @media (prefers-reduced-motion: no-preference) {
            .digger, .tunnel, .mining, .digger .discovery, .layer, .pickaxe { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: steps(1, end); }
            .digger { animation-name: descend; }
            .tunnel { animation-name: deepen; }
            .mining { animation-name: digging; }
            .digger .discovery { animation-name: show-gem; }
            .pickaxe { animation-name: swing; animation-delay: -0.15s; }
            .layer-1 { animation-name: reveal-1; }
            .layer-2 { animation-name: reveal-2; }
            .layer-3 { animation-name: reveal-3; }
            .layer-4 { animation-name: reveal-4; }
            .layer-5 { animation-name: reveal-5; }
            @keyframes descend {
                0% { transform: translate(30px, 19px); animation-timing-function: steps(5, end); }
                80% { transform: translate(30px, 259px); opacity: 1; }
                96% { transform: translate(30px, 259px); opacity: 1; animation-timing-function: steps(3, end); }
                99% { transform: translate(30px, 259px); opacity: 0; }
                100% { transform: translate(30px, 19px); opacity: 0; }
            }
            @keyframes deepen {
                0% { transform: scaleY(1); animation-timing-function: steps(5, end); }
                80%, 99% { transform: scaleY(6); }
                100% { transform: scaleY(1); }
            }
            @keyframes digging { 0% { opacity: 1; } 83%, 100% { opacity: 0; } }
            @keyframes show-gem { 0% { opacity: 0; } 83%, 100% { opacity: 1; } }
            @keyframes swing {
                0%, 16%, 32%, 48%, 64%, 80%, 100% { transform: rotate(-22deg); }
                13%, 29%, 45%, 61%, 77% { transform: rotate(14deg); }
            }
            @keyframes reveal-1 { 0%, 100% { opacity: 0; } 16%, 99% { opacity: 1; } }
            @keyframes reveal-2 { 0%, 100% { opacity: 0; } 32%, 99% { opacity: 1; } }
            @keyframes reveal-3 { 0%, 100% { opacity: 0; } 48%, 99% { opacity: 1; } }
            @keyframes reveal-4 { 0%, 100% { opacity: 0; } 64%, 99% { opacity: 1; } }
            @keyframes reveal-5 { 0%, 100% { opacity: 0; } 80%, 99% { opacity: 1; } }
        }
    </style>
