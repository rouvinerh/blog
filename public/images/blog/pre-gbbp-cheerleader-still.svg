<svg xmlns="http://www.w3.org/2000/svg" width="856" height="184" viewBox="0 0 856 184" role="img" aria-labelledby="title description">
    <title id="title">The Cheerleader’s pep talk</title>
    <desc id="description">The Cheerleader offers four suggestions to a farmer who came back empty-handed.</desc>
    <style>
        :root {
            color-scheme: light dark;
            --paper: #f0f4f7;
            --ink: #243442;
            --line: #697e90;
            --pink: #a52354;
            --tint: #f9e8ef;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #151f28;
                --ink: #e6edf3;
                --line: #829aaf;
                --pink: #ee8fb6;
                --tint: #332332;
            }
        }
        .card, .bubble { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
        .bubble { stroke: var(--pink); stroke-width: 2; }
        .option .card {
            fill: var(--card-fill, var(--paper));
            stroke: var(--card-stroke, var(--line));
            stroke-width: var(--card-weight, 1.5);
        }
        .featured {
            --card-fill: var(--tint);
            --card-stroke: var(--pink);
            --card-text: var(--pink);
            --card-weight: 2;
        }
        .label, .speech { fill: var(--ink); text-anchor: middle; font: 600 16px ui-monospace, Consolas, monospace; }
        .speech { font-size: 17px; }
        .pointer { fill: var(--pink); }
        .option .label { fill: var(--card-text, var(--ink)); }
        .agent { filter: saturate(.25); }
    </style>
