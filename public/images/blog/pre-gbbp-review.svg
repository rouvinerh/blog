<svg xmlns="http://www.w3.org/2000/svg" width="480" height="296" viewBox="0 0 480 296" role="img" aria-labelledby="title">
    <title id="title">Evidence review before submission</title>
    <style>
        :root { color-scheme: light dark; --paper: #f0f4f7; --line: #c4d4e1; --ink: #243442; --muted: #475c70; --accent: #5546a8; }
        @media (prefers-color-scheme: dark) {
            :root { --paper: #151f28; --line: #405769; --ink: #e6edf3; --muted: #b6c8da; --accent: #b8a9ff; }
        }
        .paper { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
        .flow { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .heading { fill: var(--ink); font: 700 25px ui-monospace, Consolas, monospace; }
        .detail { fill: var(--muted); font: 21px system-ui, "Segoe UI", sans-serif; }
        .tag { fill: var(--accent); font: 700 22px ui-monospace, Consolas, monospace; }
    </style>
