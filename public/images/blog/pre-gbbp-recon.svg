<svg xmlns="http://www.w3.org/2000/svg" width="856" height="190" viewBox="0 0 856 190" role="img" aria-labelledby="title description">
    <title id="title">Jackdaw’s shared recon base</title>
    <desc id="description">Programme scope, test accounts and user guides inform the saved logged-out and logged-in views. The four roles share the recon base.</desc>
    <style>
        :root { color-scheme: light dark; --paper: #f0f4f7; --base: #e3ebf2; --line: #697e90; --ink: #243442; --muted: #475c70; }
        @media (prefers-color-scheme: dark) {
            :root { --paper: #151f28; --base: #223545; --line: #829aaf; --ink: #e6edf3; --muted: #b6c8da; }
        }
        .tile { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
        .base { fill: var(--base); }
        .line, .rule { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .rule { stroke-width: 1.5; stroke-dasharray: 4 4; }
        .label { fill: var(--ink); font: 600 15px ui-monospace, Consolas, monospace; text-anchor: middle; }
        .note { fill: var(--muted); font: 500 15px system-ui, "Segoe UI", sans-serif; }
        .center { text-anchor: middle; }
    </style>
