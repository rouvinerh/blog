<svg xmlns="http://www.w3.org/2000/svg" width="400" height="572" viewBox="0 0 400 572" role="img" aria-labelledby="title">
    <title id="title">From observation to outcome</title>
    <style>
        :root {
            color-scheme: light dark;
            --text: #243442;
            --muted: #4f5f6c;
            --card: #f0f4f7;
            --card-line: #c9d5df;
            --model: #c4501a;
            --model-soft: #fbe5d8;
            --code: #1d5fa8;
            --code-soft: #dfeaf6;
            --on-fill: #ffffff;
            --arrow: #6f8191;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #e6edf3;
                --muted: #c2cfda;
                --card: #151f28;
                --card-line: #3a4b59;
                --model: #f4a16f;
                --model-soft: #34271f;
                --code: #80b8f4;
                --code-soft: #1b3044;
                --on-fill: #0f171e;
                --arrow: #768796;
            }
        }
        text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .mono { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
        .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1; }
        .card-model { fill: var(--model-soft); stroke: var(--model); stroke-width: 1.4; }
        .card-code { fill: var(--code-soft); stroke: var(--code); stroke-width: 1.4; }
        .arrow { fill: none; stroke: var(--arrow); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .step { font-size: 17px; font-weight: 600; }
        .desc { font-size: 16px; fill: var(--muted); }
        .code-inline { font-size: 15px; fill: var(--text); }
        .num { font-size: 14px; font-weight: 700; fill: var(--on-fill); text-anchor: middle; }
        .badge { fill: var(--model); }
        .badge-code { fill: var(--code); }
    </style>
    <rect x="12.5" y="8.5" width="375" height="91" rx="10" class="card" />
    <circle cx="40" cy="36" r="14" class="badge" />
    <text x="40" y="41" class="num">1</text>
    <text x="66" y="42" class="step">Observation</text>
    <text x="66" y="68" class="desc"><tspan class="mono code-inline">POST /resend</tspan> with no login</text>
    <text x="66" y="89" class="desc">returned a 500</text>
    <path d="M200 104V120M194 114l6 6 6-6" class="arrow" />
    <rect x="12.5" y="124.5" width="375" height="91" rx="10" class="card" />
    <circle cx="40" cy="152" r="14" class="badge" />
    <text x="40" y="157" class="num">2</text>
    <text x="66" y="158" class="step">Question</text>
    <text x="66" y="184" class="desc">Is anything checking</text>
    <text x="66" y="205" class="desc">authentication here?</text>
    <path d="M200 220V236M194 230l6 6 6-6" class="arrow" />
    <rect x="12.5" y="240.5" width="375" height="91" rx="10" class="card" />
    <circle cx="40" cy="268" r="14" class="badge" />
    <text x="40" y="273" class="num">3</text>
    <text x="66" y="274" class="step">Next check</text>
    <text x="66" y="300" class="desc">Rebuild the body and</text>
    <text x="66" y="321" class="desc">brute-force the parameter</text>
    <path d="M200 336V352M194 346l6 6 6-6" class="arrow" />
    <rect x="12.5" y="356.5" width="375" height="91" rx="10" class="card" />
    <circle cx="40" cy="384" r="14" class="badge" />
    <text x="40" y="389" class="num">4</text>
    <text x="66" y="390" class="step">Result</text>
    <text x="66" y="416" class="desc">Counting <tspan class="mono code-inline">appointmentId</tspan> down</text>
    <text x="66" y="437" class="desc">returned other people's letters</text>
    <path d="M200 452V468M194 462l6 6 6-6" class="arrow" />
    <rect x="12.5" y="472.5" width="375" height="91" rx="10" class="card-code" />
    <circle cx="40" cy="500" r="14" class="badge-code" />
    <text x="40" y="505" class="num">5</text>
    <text x="66" y="506" class="step">Outcome</text>
    <text x="66" y="532" class="desc">Rated High for the exposure</text>
    <text x="66" y="553" class="desc">of personal data</text>
</svg>
