<svg xmlns="http://www.w3.org/2000/svg" width="400" height="568" viewBox="0 0 400 568" role="img" aria-labelledby="title">
    <title id="title">Benchmark coverage of ATT&amp;CK</title>
    <style>
        :root {
            color-scheme: light dark;
            --text: #243442;
            --muted: #4f5f6c;
            --empty: #f0f4f7;
            --dash: #8293a1;
            --bench: #c4501a;
            --bench-soft: #f3b896;
            --on-bench: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #e6edf3;
                --muted: #c2cfda;
                --empty: #151f28;
                --dash: #839bad;
                --bench: #f4a16f;
                --bench-soft: #67442d;
                --on-bench: #0f171e;
            }
        }
        text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .mono { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
        .head { font-size: 15px; font-weight: 600; text-anchor: middle; }
        .tactic { font-size: 16px; font-weight: 600; }
        .muted { fill: var(--muted); font-weight: 500; }
        .on-bench { fill: var(--on-bench); }
        .empty { fill: var(--empty); stroke: var(--dash); stroke-width: 1.2; stroke-dasharray: 5 4; }
        .soft { fill: var(--bench-soft); stroke: var(--bench); stroke-width: 1.4; }
        .bench { fill: var(--bench); }
        .hit { fill: var(--bench); }
        .miss { fill: none; stroke: var(--dash); stroke-width: 1.4; }
    </style>
    <text x="258" y="22" class="head">NYU CTF</text>
