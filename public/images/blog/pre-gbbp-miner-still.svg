<svg xmlns="http://www.w3.org/2000/svg" width="396" height="308" viewBox="0 0 396 308" role="img" aria-labelledby="title description">
    <title id="title">The Miner’s shaft</title>
    <desc id="description">The Miner descends six layers of a pixel-art shaft and holds up a gem after finding the first bug.</desc>
    <style>
        :root {
            color-scheme: light dark;
            --paper: #f0f4f7;
            --ink: #243442;
            --line: #697e90;
            --accent: #1d5fa8;
            --pink: #a52354;
            --tint: #f9e8ef;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #151f28;
                --ink: #e6edf3;
                --line: #829aaf;
                --accent: #8ab6e5;
                --pink: #ee8fb6;
                --tint: #332332;
            }
        }
        .panel { fill: var(--paper); stroke: var(--line); }
        .label { fill: var(--ink); font: 600 16px ui-monospace, Consolas, monospace; }
        .marker { fill: var(--accent); }
        .discovery .label, .discovery .marker { fill: var(--pink); }
        .tunnel { transform: scaleY(6); transform-origin: 0 12px; }
        .digger { transform: translate(30px, 259px); }
        .mining { opacity: 0; }
        .pickaxe { transform-box: fill-box; transform-origin: 20% 75%; }
    </style>
