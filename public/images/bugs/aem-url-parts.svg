<svg xmlns="http://www.w3.org/2000/svg" width="400" height="232" viewBox="0 0 400 232" role="img" aria-labelledby="title">
    <title id="title">Sling URL parts</title>
    <style>
        :root {
            color-scheme: light dark;
            --text: #243442;
            --muted: #4f5f6c;
            --rule: #9fb0be;
            --teal: #276f66;
            --amber: #8a641f;
            --violet: #6a4fa3;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #e6edf3;
                --muted: #c2cfda;
                --rule: #61798b;
                --teal: #73c4b7;
                --amber: #e4bd78;
                --violet: #b9a3ec;
            }
        }
        text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .mono { font-family: "Cascadia Code", ui-monospace, Consolas, monospace; }
        .muted { fill: var(--muted); }
        .teal { fill: var(--teal); }
        .amber { fill: var(--amber); }
        .violet { fill: var(--violet); }
        .label { font-size: 16px; }
        .heading { font-size: 18px; font-weight: 600; }
        .small { font-size: 15px; }
        .code { font-size: 17px; }
        .rule { fill: none; stroke: var(--rule); stroke-width: 1; }
        .line { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
        .line-teal { fill: none; stroke: var(--teal); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <text x="16" y="26" class="small muted">Existing resource: <tspan class="mono">/content/example</tspan></text>
    <text x="16" y="64" class="mono code">/content/example<tspan class="teal">.infinity</tspan><tspan class="amber">.json</tspan>/a.css</text>
    <path d="M16 84H384" class="rule" />
    <text x="16" y="116" class="mono code ">/content/example</text>
    <text x="384" y="116" class="label " text-anchor="end">Resource path</text>
    <text x="16" y="148" class="mono code teal">.infinity</text>
    <text x="384" y="148" class="label teal" text-anchor="end">Selector</text>
    <text x="16" y="180" class="mono code amber">.json</text>
    <text x="384" y="180" class="label amber" text-anchor="end">Extension</text>
    <text x="16" y="212" class="mono code ">/a.css</text>
    <text x="384" y="212" class="label " text-anchor="end">Suffix</text>
</svg>
